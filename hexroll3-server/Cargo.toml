[package]
name = "hexroll3-server"
version = "0.1.0"
edition = "2021"
description = "HTTP server wrapping the hexroll3 engine — generates seeded OSR worlds on demand"

[[bin]]
name = "hexroll3-server"
path = "src/main.rs"

[dependencies]
hexroll3-scroll = { path = "../hexroll3-scroll" }
hexroll3-cartographer = { path = "../hexroll3-cartographer" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "fs", "sync"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
